data:
  cache_dir: data/cache
  distillation_dataset_dir: data/processed/
  mode: distillation
  train_fraction: 1.0
lora:
  alpha: 32
  dropout: 0.05
  rank: 16
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
model:
  load_in_4bit: false
  load_in_8bit: false
  name: Qwen/Qwen2.5-0.5B-Instruct
training:
  eval_steps: 200
  fp16: true
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  logging_steps: 50
  lr_scheduler_type: cosine
  max_seq_length: 512
  num_epochs: 3
  output_dir: data/checkpoints/distillation_updated
  per_device_eval_batch_size: 4
  per_device_train_batch_size: 4
  save_steps: 200
  save_total_limit: 2
  seed: 42
  warmup_ratio: 0.05
