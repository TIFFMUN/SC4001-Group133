model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  load_in_4bit: false
  load_in_8bit: false
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
training:
  output_dir: data/checkpoints/distillation_updated
  num_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  max_seq_length: 512
  logging_steps: 50
  eval_steps: 200
  save_steps: 200
  save_total_limit: 2
  fp16: true
  seed: 42
data:
  mode: distillation
  train_fraction: 1.0
  distillation_dataset_dir: data/processed/
  cache_dir: data/cache
